<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perguntas Anônimas - Daniel</title>
  <!-- SDK Oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0F0F12; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1C1C24; padding: 24px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #2A2A35; }
    h2 { font-size: 20px; margin-bottom: 20px; }
    textarea { width: 100%; height: 120px; background: #0F0F12; border: 1px solid #2A2A35; border-radius: 12px; color: #fff; padding: 12px; font-size: 16px; resize: none; margin-bottom: 12px; outline: none; }
    input { width: 100%; background: #0F0F12; border: 1px solid #2A2A35; border-radius: 12px; color: #fff; padding: 12px; font-size: 14px; margin-bottom: 20px; outline: none; }
    button { width: 100%; background: #FF2A5F; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Mande uma pergunta anônima para Daniel</h2>
    <textarea id="texto" placeholder="Envie-me perguntas anônimas..."></textarea>
    <input id="arroba" type="text" placeholder="Seu @ do Instagram (Ex: @seuuser)">
    <button id="btn" onclick="enviar()">Enviar Pergunta</button>
  </div>

  <script>
    // Substitua pelos dados do seu projeto no Supabase (Project Settings > API)
    const SUPABASE_URL = "https://SEU_PROJETO.supabase.co";
    const SUPABASE_ANON_KEY = "SUA_CHAVE_ANON_PUBLIC";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function enviar() {
      const texto = document.getElementById('texto').value.trim();
      const arroba = document.getElementById('arroba').value.trim();
      const btn = document.getElementById('btn');

      if (!texto) return alert('Escreva uma pergunta!');
      if (!arroba || !arroba.startsWith('@')) return alert('Digite seu @ do Instagram (Ex: @usuario)!');

      btn.disabled = true;
      btn.innerText = 'Enviando...';

      const { error } = await supabase
        .from('perguntas')
        .insert([{ texto: texto, arroba: arroba }]);

      if (error) {
        console.error(error);
        alert('Erro ao enviar pergunta.');
      } else {
        alert('Pergunta enviada com sucesso!');
        document.getElementById('texto').value = '';
        document.getElementById('arroba').value = '';
      }

      btn.disabled = false;
      btn.innerText = 'Enviar Pergunta';
    }
  </script>
</body>
</html>
